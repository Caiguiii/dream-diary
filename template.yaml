AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  GroqApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Groq API key (free at console.groq.com)

Globals:
  Function:
    Timeout: 15
    Runtime: python3.12
    Environment:
      Variables:
        TABLE_NAME: !Ref DreamsTable

Resources:

  # --- Cognito ---
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: DreamJournalUserPool
      UsernameAttributes:
        - email
      LambdaConfig:
        PreSignUp: !GetAtt PreSignUpFunction.Arn
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: false
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: DreamJournalClient
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH

  # --- DynamoDB ---
  DreamsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DreamJournal
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE

  # --- HTTP API ---
  DreamApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: DreamJournalApi
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Authorization
          - Content-Type

  DreamApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref DreamApi
      StageName: prod
      AutoDeploy: true

  DreamApiAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref DreamApi
      AuthorizerType: JWT
      IdentitySource:
        - '$request.header.Authorization'
      JwtConfiguration:
        Audience:
          - !Ref UserPoolClient
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
      Name: CognitoJWT

  # --- Analyze Dream (Groq) ---
  AnalyzeDreamFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/analyze_dream/
      Handler: handler.handler
      Timeout: 60
      Environment:
        Variables:
          GROQ_API_KEY: !Ref GroqApiKey
          GROQ_MODEL: 'llama-3.3-70b-versatile'

  AnalyzeDreamIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref DreamApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AnalyzeDreamFunction.Arn}/invocations'
      PayloadFormatVersion: '2.0'

  AnalyzeDreamRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref DreamApi
      RouteKey: 'POST /analyze'
      AuthorizationType: JWT
      AuthorizerId: !Ref DreamApiAuthorizer
      Target: !Sub 'integrations/${AnalyzeDreamIntegration}'

  AnalyzeDreamPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt AnalyzeDreamFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${DreamApi}/*'

  # --- Pre Sign-up Trigger ---
  PreSignUpFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/pre_signup/
      Handler: handler.handler

  PreSignUpPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt PreSignUpFunction.Arn
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  # --- Lambda Functions ---
  ListDreamsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/list_dreams/
      Handler: handler.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DreamsTable

  SaveDreamFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/save_dream/
      Handler: handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DreamsTable

  DeleteDreamFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/delete_dream/
      Handler: handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DreamsTable

  # --- API Routes ---
  ListDreamsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref DreamApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ListDreamsFunction.Arn}/invocations'
      PayloadFormatVersion: '2.0'

  SaveDreamIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref DreamApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SaveDreamFunction.Arn}/invocations'
      PayloadFormatVersion: '2.0'

  DeleteDreamIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref DreamApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DeleteDreamFunction.Arn}/invocations'
      PayloadFormatVersion: '2.0'

  ListDreamsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref DreamApi
      RouteKey: 'GET /dreams'
      AuthorizationType: JWT
      AuthorizerId: !Ref DreamApiAuthorizer
      Target: !Sub 'integrations/${ListDreamsIntegration}'

  SaveDreamRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref DreamApi
      RouteKey: 'POST /dreams'
      AuthorizationType: JWT
      AuthorizerId: !Ref DreamApiAuthorizer
      Target: !Sub 'integrations/${SaveDreamIntegration}'

  DeleteDreamRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref DreamApi
      RouteKey: 'DELETE /dreams/{id}'
      AuthorizationType: JWT
      AuthorizerId: !Ref DreamApiAuthorizer
      Target: !Sub 'integrations/${DeleteDreamIntegration}'

  ListDreamsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ListDreamsFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${DreamApi}/*'

  SaveDreamPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt SaveDreamFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${DreamApi}/*'

  DeleteDreamPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt DeleteDreamFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${DreamApi}/*'

  # --- S3 + CloudFront ---
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'dream-journal-${AWS::AccountId}-${AWS::Region}'

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: DreamJournalOAC
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig: {}
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

Outputs:
  ApiUrl:
    Description: REST API endpoint
    Value: !Sub 'https://${DreamApi}.execute-api.${AWS::Region}.amazonaws.com/prod'

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient

  CloudFrontUrl:
    Description: Frontend URL
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'

  FrontendBucketName:
    Description: S3 bucket for frontend
    Value: !Ref FrontendBucket
